<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>VerseLock</title><link rel="manifest" href="manifest.json"><meta name="theme-color" content="#0f1420"><link rel="apple-touch-icon" href="icon.svg">
<style>body{margin:0;font-family:system-ui;background:#0f1420;color:#eee}main{max-width:480px;margin:auto;padding:20px}
h1{font-size:22px}.card{background:#1a2133;border-radius:14px;padding:16px;margin:12px 0}button{background:#e8c46a;border:0;border-radius:10px;padding:12px 16px;font-weight:600;margin:4px 4px 0 0;cursor:pointer}
button.q{background:#2b3550;color:#eee}input,textarea,select{width:100%;box-sizing:border-box;padding:10px;border-radius:8px;border:0;margin:6px 0;font-size:16px}
nav{display:flex;flex-wrap:wrap;gap:4px}.big{font-size:40px;font-weight:700;color:#e8c46a}.muted{color:#9aa}.pro{color:#e8c46a;font-size:12px}</style></head>
<body><main id="app"></main><script src="app.js"></script></body></html>
